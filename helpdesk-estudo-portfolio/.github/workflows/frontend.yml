name: Testes do modo demonstracao
on:
  push:
    paths:
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/frontend.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/demo.test.js
