name: helpdesk-pro
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_local_mude_antes_publicar}
    volumes:
      - helpdesk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/helpdesk
      DATABASE_USER: helpdesk
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-demo_local_mude_antes_publicar}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    networks: [internal]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:8088:80"
    networks: [internal]

networks:
  internal:

volumes:
  helpdesk_data:
